name: Validate ART Corpus

on:
  push:
    paths:
      - "corpus/**"
      - "scripts/validate_corpus.py"
      - ".github/workflows/validate-corpus.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "scripts/validate_corpus.py"
      - ".github/workflows/validate-corpus.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"

      - name: Validate corpus
        run: python scripts/validate_corpus.py
